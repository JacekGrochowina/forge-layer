<div class="table-wrap"><table><thead><tr><th>Property</th><th>Type</th><th>Default</th><th>Description</th></tr></thead><tbody>@for (item of properties(); track item.property) { <tr><td><code>{{ item.property }}</code></td><td><code>{{ item.type }}</code></td><td><code>{{ item.default }}</code></td><td>{{ item.description }}</td></tr> }</tbody></table></div>
