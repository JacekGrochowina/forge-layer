<mat-toolbar class="docs-toolbar"><button mat-icon-button class="menu-button" aria-label="Open navigation" (click)="sidenav.toggle()"><mat-icon>menu</mat-icon></button><a routerLink="/" class="brand"><span>Forge</span> Layer</a><span class="toolbar-spacer"></span><a mat-button href="https://github.com/JacekGrochowina/forge-layer" target="_blank" rel="noreferrer"><mat-icon>code</mat-icon> GitHub</a></mat-toolbar>
<mat-sidenav-container class="docs-container"><mat-sidenav #sidenav class="docs-sidenav" [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()"><nav aria-label="Documentation navigation">@for (group of navigation; track group.label) { @if (group.label) { <h2>{{ group.label }}</h2> } <mat-nav-list>@for (item of group.items; track item.route) { <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: item.route === '/' }" (click)="closeOnMobile()"><mat-icon matListItemIcon>{{ item.icon }}</mat-icon><span matListItemTitle>{{ item.label }}</span></a> }</mat-nav-list> }</nav></mat-sidenav><mat-sidenav-content><main class="docs-content"><router-outlet /></main></mat-sidenav-content></mat-sidenav-container>
